[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curvature-transfer"
version = "1.1.0"
description = "Experiments for comparing edgewise graph curvatures and analytic envelopes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
# The library (curvature_transfer) needs only these. Exact curvatures come from
# orcut, pinned to 1.0.0: the solver that produced every exact value of the paper.
dependencies = [
    "numba==0.62.1",
    "numpy==2.2.0",
    "orcut @ git+https://github.com/GiorgioMB/orcut.git@v1.0.0",
    "scipy==1.16.2",
]

[project.optional-dependencies]
# Experiment pipeline, figures, and the graph generators used by the tests.
experiments = [
    "matplotlib==3.10.7",
    "networkx==3.3",
    "numexpr==2.13.1",
    "pandas==2.3.3",
]
# Rewiring / GNN case study (Appendix A). With pip, install torch for your
# platform first (CPU wheels: --index-url https://download.pytorch.org/whl/cpu)
# and pass -f https://data.pyg.org/whl/torch-2.8.0+cpu.html for the PyG
# extensions; with uv, both come from the sources configured below.
gnn = [
    "ogb==1.3.6",
    "optuna==5.0.0",
    "pandas==2.3.3",
    "scikit-learn==1.9.1",
    "torch==2.8.0",
    "torch-cluster==1.6.3",
    "torch-geometric==2.6.1",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-spline-conv==1.2.2",
]
dev = [
    "hypothesis==6.168.0",
    "pytest==8.4.2",
]

[dependency-groups]
dev = [
    "hypothesis==6.168.0",
    "pytest==8.4.2",
]

[tool.setuptools]
packages = ["curvature_transfer"]

[tool.uv]
# CPU wheels of the PyG extensions (torch-scatter etc.), matching torch 2.8.0+cpu.
find-links = ["https://data.pyg.org/whl/torch-2.8.0+cpu.html"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
orcut = { git = "https://github.com/GiorgioMB/orcut", tag = "v1.0.0" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
