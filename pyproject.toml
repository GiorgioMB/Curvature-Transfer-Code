[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tqbound"
version = "2.0.0"
description = "The triangle-quadrangle bound on Ollivier-Ricci curvature: library and experiments"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
# The library (tqbound) needs only these. Exact curvatures and the timing baseline come from
# orcut 1.3.1 (PyPI: faster-or-curvature; native backend), the versions with which the suite was validated.
dependencies = [
    "faster-or-curvature==1.3.1",
    "numba==0.68.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[project.optional-dependencies]
# Experiment pipeline, figures, and the graph generators used by the tests.
experiments = [
    "matplotlib==3.11.2",
    "networkx==3.7",
]
dev = [
    "hypothesis==6.168.0",
    "pytest==8.4.2",
]

[dependency-groups]
dev = [
    "hypothesis==6.168.0",
    "pytest==8.4.2",
]

[tool.setuptools]
packages = ["tqbound"]

