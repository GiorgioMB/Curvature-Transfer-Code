[project]
name = "curvature-transfer"
version = "0.1.0"
description = "Experiments for comparing edgewise graph curvatures and analytic envelopes"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib==3.10.7",
    "networkx==3.3",
    "numba==0.62.1",
    "numexpr==2.13.1",
    "numpy==2.2.0",
    "ogb==1.3.6",
    "optuna==5.0.0",
    "pandas==2.3.3",
    "scikit-learn==1.9.1",
    "scipy==1.16.2",
    "torch==2.8.0+cpu",
    "torch-cluster==1.6.3+pt28cpu",
    "torch-geometric==2.6.1",
    "torch-scatter==2.1.2+pt28cpu",
    "torch-sparse==0.6.18+pt28cpu",
    "torch-spline-conv==1.2.2+pt28cpu",
    "torchaudio==2.8.0+cpu",
    "torchvision==0.23.0+cpu",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "hypothesis==6.168.0",
    "pytest==8.4.2",
]

[tool.uv]
package = false
find-links = ["https://data.pyg.org/whl/torch-2.8.0+cpu.html"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
